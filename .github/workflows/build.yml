name: Build TrollStore IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iPhoneCam.ipa
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # Use Xcode 16 if installed on runner, otherwise fallback gracefully
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Fix Xcode Project Format Compatibility
        run: |
          # Lower objectVersion from 77 (Xcode 16+) to 56 (Xcode 14/15/16 compatible)
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/g' iPhoneCam.xcodeproj/project.pbxproj
          echo "Patched project.pbxproj objectVersion to 56 for universal compatibility."
          grep "objectVersion" iPhoneCam.xcodeproj/project.pbxproj

      - name: Build Archive (No Code Signing for TrollStore)
        run: |
          xcodebuild archive \
            -project iPhoneCam.xcodeproj \
            -scheme iPhoneCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iPhoneCam.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/iPhoneCam.xcarchive/Products/Applications/iPhoneCam.app Payload/
          zip -r -9 iPhoneCam.ipa Payload
          echo "IPA packaging completed successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneCam-ipa
          path: iPhoneCam.ipa
          retention-days: 30

      - name: Create Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: iPhoneCam.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
