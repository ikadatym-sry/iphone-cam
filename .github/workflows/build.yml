name: Build TrollStore IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iPhoneCam.ipa
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive (No Code Signing for TrollStore)
        run: |
          xcodebuild archive \
            -project iPhoneCam.xcodeproj \
            -scheme iPhoneCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iPhoneCam.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/iPhoneCam.xcarchive/Products/Applications/iPhoneCam.app Payload/
          zip -r -9 iPhoneCam.ipa Payload
          echo "IPA packaging completed successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneCam-ipa
          path: iPhoneCam.ipa
          retention-days: 30

      - name: Create Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: iPhoneCam.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
